Adjust="spacing">every cited claim. Gemini ↔ Ollama, Pinecone ↔</text><text x="50.0" y="462.0" font-size="12.5" fill="#a9b2bd" textLength="52.5" lengthAdjust="spacing">Qdrant.</text><text x="50.0" y="495.0" font-size="11.5" fill="#9aa3b2" textLength="296.7" lengthAdjust="spacing">fastapi · react · gemini · qdrant · mongodb</text></g><g class="rise" style="animation-delay:1.80s"><rect x="30.0" y="529.0" width="420.0" height="188.0" rx="10" fill="#10141a" stroke="#252b34"/><rect x="30.0" y="529.0" width="3" height="188.0" rx="1.5" fill="#c3cedb"/><text x="50.0" y="561.0" font-size="18" fill="#dde2e8" font-weight="700" textLength="108.0" lengthAdjust="spacing">WardrobeAI</text><text x="50.0" y="581.0" font-size="12" fill="#93a6bd" textLength="158.4" lengthAdjust="spacing">3D Try-On &amp; AI Stylist</text><text x="434.0" y="581.0" font-size="11" fill="#717b87" text-anchor="end" textLength="46.2" lengthAdjust="spacing">private</text><rect x="367.8" y="546.0" width="66.2" height="22" rx="11" fill="none" stroke="#c3cedb" opacity=".7"/><circle class="pulse" cx="357.8" cy="557.0" r="3.5" fill="#c3cedb"/><text x="377.8" y="561.0" font-size="11" fill="#c3cedb" font-weight="700" textLength="46.2" lengthAdjust="spacing">ONGOING</text><text x="50.0" y="609.0" font-size="12.5" fill="#a9b2bd" textLength="375.0" lengthAdjust="spacing">Virtual wardrobe with a three.js try-on avatar and</text><text x="50.0" y="628.0" font-size="12.5" fill="#a9b2bd" textLength="345.0" lengthAdjust="spacing">a Gemini stylist that builds outfits only from</text><text x="50.0" y="647.0" font-size="12.5" fill="#a9b2bd" textLength="360.0" lengthAdjust="spacing">clothes you own. Next.js 15, Auth.js, Cloudinary</text><text x="50.0" y="666.0" font-size="12.5" fill="#a9b2bd" textLength="270.0" lengthAdjust="spacing">and an SSRF-guarded product scraper.</text><text x="50.0" y="699.0" font-size="11.5" fill="#9aa3b2" textLength="276.0" lengthAdjust="spacing">next.js · typescript · three.js · gemini</text></g><g cl