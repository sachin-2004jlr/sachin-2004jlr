<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-label="About: I&#x27;m a Full Stack AI Engineer who builds intelligent, production-grade applications, from model to interface. My sweet spot is where Generative AI meets dependable engineering: semantic search, RAG, agents, and the unglamorous-but-essential auth, access control and rate limiting.">
<title>About: I&#x27;m a Full Stack AI Engineer who builds intelligent, production-grade applications, from model to interface. My sweet spot is where Generative AI meets dependable engineering: semantic search, RAG, agents, and the unglamorous-but-essential auth, access control and rate limiting.</title>
<defs>
  <clipPath id="frame"><rect width="480" height="560" rx="14"/></clipPath>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
  </pattern>
  <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
    <stop offset="62%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a47cf3" stop-opacity="0"/>
    <stop offset="100%" stop-color="#a47cf3" stop-opacity=".06"/>
  </linearGradient>
  <style>
  text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; white-space: pre; }
  .in   { animation: fadein .45s ease-out both; }
  .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .blink { animation: blink 1.05s steps(1) infinite; }
  .sweep { animation: sweep 7s linear infinite; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Runs to -100% over 2n steps: Chromium never paints the final step of a
     stepped clip-path, so every character is revealed by step n of 2n. */
  @keyframes type {
    from { -webkit-clip-path: inset(-30% 100% -30% 0); clip-path: inset(-30% 100% -30% 0); }
    to   { -webkit-clip-path: inset(-30% -100% -30% 0); clip-path: inset(-30% -100% -30% 0); }
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(var(--h)); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</defs>
