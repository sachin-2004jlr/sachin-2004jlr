name: Update contribution graph

on:
  schedule:
    - cron: "7 * * * *" # hourly: picks up work pushed to any repo, private included
  push:
    branches: [main] # bot pushes use GITHUB_TOKEN, which never re-triggers this
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Let GitHub count the commit that triggered this run
        if: github.event_name == 'push'
        run: sleep 60

      - name: Fetch contributions and render graph
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_contributions.py

      - name: Commit if the graph changed
        run: |
          files="data/contributions.json assets/contributions.svg assets/contributions-mobile.svg"
          # Skip timestamp-only churn; commit only when the data actually moved.
          if git diff --quiet -I '"generated_at"' -I 'synced 20' -- $files; then
            echo "No changes in contributions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README carries the content-hash links that bust image caches.
          git add $files README.md
          git commit -m "chore: refresh contribution graph"
          git pull --rebase
          git push
